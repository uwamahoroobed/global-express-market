<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152b">
<title>OB Shop â€” Marketplace</title>
<style>
:root{
  --navy:#07152b;--navy2:#0d1c35;--green:#08a875;--green2:#0bc48b;
  --yellow:#ffbf18;--bg:#f6f8fb;--text:#142238;--muted:#718096;
  --white:#fff;--line:#e4e9f0;--danger:#e5484d;--shadow:0 8px 28px rgba(7,21,43,.09)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.top{background:linear-gradient(135deg,#061329,#102743);color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:20;box-shadow:0 5px 20px #07152b22}
.head{display:flex;align-items:center;gap:12px;max-width:1180px;margin:auto}
.logo{width:60px;height:60px;border-radius:18px;background:var(--green);display:grid;place-items:center;font-weight:900;font-size:25px;flex:none}
.brand{font-size:25px;font-weight:900;line-height:1}.brand span{color:var(--yellow)}.tag{font-size:12px;color:#aebbd0;margin-top:7px}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px}.pill{background:#132741;border:1px solid #36506f;color:#fff;border-radius:25px;padding:10px 13px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#132741;color:#fff;font-size:20px;position:relative}
.badge{position:absolute;right:-2px;top:-4px;background:#ef4148;color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center}
.search{max-width:1180px;margin:18px auto 0;display:flex;gap:8px}.search input{width:100%;border:0;border-radius:20px;padding:16px 18px;font-size:16px;outline:none;box-shadow:0 4px 20px #0002}
.wrap{max-width:1180px;margin:auto;padding:18px 18px 100px}
.cats{display:flex;gap:10px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{min-width:max-content;padding:11px 15px;border-radius:22px;background:#fff;border:1px solid var(--line);font-weight:700;color:#304158}.cat.active{background:var(--green);color:#fff;border-color:var(--green)}
.hero{background:linear-gradient(110deg,#064f49,#008b6d);border-radius:22px;color:#fff;padding:25px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;box-shadow:var(--shadow);margin:6px 0 24px}
.hero h1{margin:0;font-size:31px}.hero h1 span{color:var(--yellow)}.hero p{margin:9px 0 16px;color:#d8fff2}.hero .cta{background:var(--yellow);color:#102238;padding:12px 18px;border-radius:25px;font-weight:900}.hero-art{font-size:90px;filter:drop-shadow(0 10px 8px #0003)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}.section-head h2{margin:0;font-size:23px}.section-head button{background:none;color:var(--green);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 4px 16px #07152b0b;position:relative}
.pic{height:190px;background:#eef2f5;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:60px}
.fav{position:absolute;right:9px;top:9px;width:35px;height:35px;border-radius:50%;background:#fffdd;color:#24334a;font-size:19px;box-shadow:0 2px 10px #0002}
.info{padding:13px}.name{font-weight:800;font-size:15px;min-height:38px}.price{font-weight:900;color:#07966d;font-size:18px;margin:7px 0}.meta{font-size:12px;color:var(--muted);margin:3px 0}
.add{width:100%;margin-top:9px;padding:11px;border-radius:10px;background:var(--green);color:#fff;font-weight:850}.add:active{transform:scale(.98)}
.empty{background:#fff;border:1px dashed #ccd5e1;border-radius:18px;padding:35px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:68px;display:flex;justify-content:space-around;z-index:30}.bottom button{background:none;color:#506177;font-size:11px;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottom button.active{color:var(--green)}.bottom b{font-size:21px}
.overlay{display:none;position:fixed;inset:0;background:#07152b88;z-index:50;align-items:flex-end;justify-content:center}.overlay.show{display:flex}
.sheet{background:#fff;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .18s ease}@keyframes up{from{transform:translateY(50px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0}.close{width:38px;height:38px;border-radius:50%;background:#edf1f5}.cartrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.cartimg{width:65px;height:65px;border-radius:10px;object-fit:cover;background:#eee}.grow{flex:1}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:8px;background:#e9eef3}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:16px 0}.primary{width:100%;padding:14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:900}.greenbtn{background:var(--green)}
.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #d5dde7;border-radius:11px;outline:none}.form textarea{min-height:90px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(20px);background:#101e31;color:#fff;padding:12px 18px;border-radius:25px;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
.admin{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:20px}.admin h3{margin-top:0}.orders{display:grid;gap:9px}.order{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbfc}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.pic{height:170px}}
@media(max-width:650px){.top{padding:14px 14px 16px}.logo{width:52px;height:52px;border-radius:15px}.brand{font-size:22px}.tag{font-size:10px}.pill{display:none}.wrap{padding:14px 12px 92px}.hero{padding:20px}.hero h1{font-size:25px}.hero-art{font-size:65px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:145px}.info{padding:10px}.name{font-size:14px}.price{font-size:16px}.actions .iconbtn{width:39px;height:39px}}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.pic{height:125px}.hero-art{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="head">
    <div class="logo">OB</div>
    <div><div class="brand">OB <span>Shop</span></div><div class="tag" data-t="tag">Everything you need, in one place</div></div>
    <div class="actions">
      <select class="pill" id="lang" aria-label="Language"><option value="rw">ðŸ‡·ðŸ‡¼ Kinyarwanda</option><option value="en">ðŸ‡¬ðŸ‡§ English</option></select>
      <button class="iconbtn" onclick="openCart()" aria-label="Cart">ðŸ›’<span class="badge" id="cartBadge">0</span></button>
      <button class="iconbtn" onclick="openAccount()" aria-label="Account">ðŸ‘¤</button>
    </div>
  </div>
  <div class="search"><input id="search" type="search" placeholder="ðŸ”Ž Shakisha ibicuruzwa, abaguz..." oninput="render()"></div>
</header>

<main class="wrap">
  <nav class="cats" id="cats"></nav>

  <section class="hero">
    <div><h1>OB Shop<br><span data-t="hero">Gura, Vugure, Ubuhahirane</span></h1><p data-t="heroSub">Ibicuruzwa byinshi, ku giciro cyiza.</p><button class="cta" onclick="document.getElementById('products').scrollIntoView()">Shakisha Ubu â†’</button></div>
    <div class="hero-art">ðŸ›’</div>
  </section>

  <div class="section-head"><h2>ðŸ”¥ <span data-t="new">Ibicuruzwa Bishya</span></h2><button onclick="clearFilters()">Reba byose â†’</button></div>
  <section id="products" class="grid"></section>

  <section id="adminPanel" class="admin" style="display:none">
    <div class="section-head"><h3>âš™ï¸ Admin / Seller</h3><button onclick="closeAccount()">Funga</button></div>
    <form class="form" onsubmit="addProduct(event)">
      <div class="row2"><input id="pname" required placeholder="Izina ry'igicuruzwa"><input id="pprice" required type="number" min="0" placeholder="Igiciro RWF"></div>
      <div class="row2"><select id="pcat"></select><input id="plocation" placeholder="Aho giherereye"></div>
      <div class="row2"><input id="pseller" placeholder="Seller / Shop"><input id="pemoji" placeholder="Emoji (ðŸ“±)"></div>
      <input id="pimage" type="url" placeholder="URL y'ifoto (optional)">
      <textarea id="pdesc" placeholder="Ibisobanuro"></textarea>
      <button class="primary greenbtn">âž• Shyiramo igicuruzwa</button>
    </form>
  </section>
</main>

<nav class="bottom">
  <button class="active" onclick="home()"><b>âŒ‚</b>Home</button>
  <button onclick="showCategories()"><b>â–¦</b>Categories</button>
  <button onclick="openCart()"><b>ðŸ›’</b>Cart</button>
  <button onclick="showOrders()"><b>â–¤</b>Orders</button>
  <button onclick="openAccount()"><b>â™™</b>Account</button>
</nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const seed=[
{id:1,name:"Samsung Galaxy A15",price:250000,cat:"Phones",loc:"Kigali",seller:"TechWorld",emoji:"ðŸ“±",image:"https://images.unsplash.com/photo-1610945415295-d9bbf6a8d4e1?auto=format&fit=crop&w=700&q=80",desc:"Smartphone nziza, battery ikomeye."},
{id:2,name:"Inkweto za Nike",price:18000,cat:"Fashion",loc:"Kigali",seller:"Fashion Hub",emoji:"ðŸ‘Ÿ",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80",desc:"Inkweto za siporo."},
{id:3,name:"Imbuto nziza",price:15000,cat:"Food",loc:"Musanze",seller:"AgriFresh",emoji:"ðŸŽ",image:"https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=700&q=80",desc:"Basket y'imbuto nshya."},
{id:4,name:"HP Laptop i5",price:350000,cat:"Electronics",loc:"Kigali",seller:"TechZone",emoji:"ðŸ’»",image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=700&q=80",desc:"Laptop ikoreshwa neza mu kazi no kwiga."},
{id:5,name:"Backpack",price:22000,cat:"Fashion",loc:"Kigali",seller:"OB Fashion",emoji:"ðŸŽ’",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=80",desc:"Isakoshi ikomeye."},
{id:6,name:"Beauty Care Set",price:28000,cat:"Beauty",loc:"Kigali",seller:"Beauty House",emoji:"ðŸ§´",image:"https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=700&q=80",desc:"Ibikoresho by'isuku n'ubwiza."},
{id:7,name:"Hoodie",price:30000,cat:"Fashion",loc:"Huye",seller:"Style Rwanda",emoji:"ðŸ§¥",image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=80",desc:"Hoodie ishyushye kandi nziza."},
{id:8,name:"Samsung Galaxy S23",price:650000,cat:"Phones",loc:"Kigali",seller:"Mobile Center",emoji:"ðŸ“±",image:"https://images.unsplash.com/photo-1678911820864-e2c567c655d7?auto=format&fit=crop&w=700&q=80",desc:"Flagship smartphone."}
];
let products=JSON.parse(localStorage.getItem("ob_products")||"null")||seed;
let cart=JSON.parse(localStorage.getItem("ob_cart")||"[]");
let orders=JSON.parse(localStorage.getItem("ob_orders")||"[]");
let category="All";

const cats=["All","Phones","Electronics","Fashion","Food","Beauty","Home","Vehicles","Services"];
const catNames={All:"All",Phones:"ðŸ“± Phones",Electronics:"ðŸ’» Electronics",Fashion:"ðŸ‘• Fashion",Food:"ðŸ›’ Food",Beauty:"ðŸ§´ Beauty",Home:"ðŸ  Home",Vehicles:"ðŸš— Vehicles",Services:"ðŸ”§ Services"};
function money(n){return Number(n).toLocaleString("en-US")+" RWF"}
function save(){localStorage.setItem("ob_products",JSON.stringify(products));localStorage.setItem("ob_cart",JSON.stringify(cart));localStorage.setItem("ob_orders",JSON.stringify(orders));updateBadge()}
function updateBadge(){document.getElementById("cartBadge").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function renderCats(){
 document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${category===c?"active":""}" onclick="setCat('${c}')">${catNames[c]}</button>`).join("");
 document.getElementById("pcat").innerHTML=cats.filter(x=>x!=="All").map(c=>`<option>${c}</option>`).join("");
}
function setCat(c){category=c;render()}
function clearFilters(){category="All";document.getElementById("search").value="";render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){
 renderCats();
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=products.filter(p=>(category==="All"||p.cat===category)&&(!q||[p.name,p.cat,p.loc,p.seller,p.desc].join(" ").toLowerCase().includes(q)));
 const el=document.getElementById("products");
 if(!list.length){el.innerHTML=`<div class="empty" style="grid-column:1/-1"><div style="font-size:45px">ðŸ”Ž</div><h3>Nta bicuruzwa bibonetse</h3><p>Gerageza irindi jambo cyangwa category.</p></div>`;return}
 el.innerHTML=list.map(p=>`
 <article class="card">
   <button class="fav" onclick="favorite(event,${p.id})">â™¡</button>
   <div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none';this.parentNode.querySelector('.placeholder').style.display='block'">`:""}<span class="placeholder" ${p.image?'style="display:none"':''}>${p.emoji||"ðŸ›ï¸"}</span></div>
   <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="meta">ðŸ“ ${esc(p.loc||"Rwanda")}</div><div class="meta">ðŸ‘¤ ${esc(p.seller||"Seller")}</div><button class="add" onclick="addCart(${p.id})">ðŸ›’ Add to Cart</button></div>
 </article>`).join("");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function addCart(id){const p=products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});save();toast("âœ… Byashyizwe muri Cart");}
function favorite(e,id){e.stopPropagation();e.currentTarget.textContent=e.currentTarget.textContent==="â™¡"?"â™¥":"â™¡"}
function openCart(){
 let rows=cart.map(x=>{let p=products.find(p=>p.id===x.id);return p?`<div class="cartrow"><div class="cartimg">${p.image?`<img class="cartimg" src="${esc(p.image)}">`:p.emoji}</div><div class="grow"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">âˆ’</button>${x.qty}<button onclick="changeQty(${p.id},1)">+</button><button onclick="removeCart(${p.id})" style="margin-left:auto;background:none;color:#d33">Remove</button></div></div></div>`:""}).join("");
 let total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0);
 openModal(`<div class="sheet-head"><h2>ðŸ›’ Shopping Cart</h2><button class="close" onclick="closeModal()">âœ•</button></div>
 ${rows||`<div class="empty" style="margin-top:18px">Cart yawe irimo ubusa.</div>`}
 ${cart.length?`<div class="total"><span>Igiteranyo</span><span style="color:var(--green)">${money(total)}</span></div><button class="primary greenbtn" onclick="checkout()">KOMEZA KWISHYURA / CHECKOUT</button>`:""}`);
}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);save();openCart()}
function removeCart(id){cart=cart.filter(x=>x.id!==id);save();openCart()}
function checkout(){
 if(!cart.length)return;
 const total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0);
 openModal(`<div class="sheet-head"><h2>ðŸ“¦ Checkout</h2><button class="close" onclick="closeModal()">âœ•</button></div>
 <p style="color:var(--muted)">Uzuza amakuru yo kwakirirwaho order.</p>
 <form class="form" onsubmit="placeOrder(event)">
 <input id="buyer" required placeholder="Amazina yawe"><input id="phone" required placeholder="Telefoni (07...)">
 <input id="address" required placeholder="Aho delivery izajya">
 <select id="payment"><option>Cash on Delivery</option><option>MoMo (kwishyura nyuma yo kwemeza order)</option></select>
 <div class="total"><span>Total</span><span style="color:var(--green)">${money(total)}</span></div>
 <button class="primary greenbtn">âœ… Ohereza Order</button></form>`);
}
function placeOrder(e){
 e.preventDefault();const total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0);
 orders.unshift({id:"OB-"+Date.now(),date:new Date().toLocaleString(),items:[...cart],total,buyer:buyer.value,phone:phone.value,address:address.value,payment:payment.value,status:"Pending"});
 cart=[];save();closeModal();toast("âœ… Order yawe yakiriwe!");setTimeout(showOrders,500);
}
function showOrders(){
 const rows=orders.map(o=>`<div class="order"><b>${o.id}</b><div>${o.date}</div><div>ðŸ‘¤ ${esc(o.buyer)} Â· ðŸ“ž ${esc(o.phone)}</div><div>ðŸ’° <b>${money(o.total)}</b></div><div>ðŸ“Œ Status: <b style="color:var(--green)">${o.status}</b></div></div>`).join("");
 openModal(`<div class="sheet-head"><h2>ðŸ“¦ Orders</h2><button class="close" onclick="closeModal()">âœ•</button></div>${rows||`<div class="empty">Nta order urakora.</div>`}`);
}
function openAccount(){
 openModal(`<div class="sheet-head"><h2>ðŸ‘¤ Account</h2><button class="close" onclick="closeModal()">âœ•</button></div>
 <div class="admin" style="margin-top:15px"><h3>Gurisha kuri OB Shop</h3><p style="color:var(--muted)">Shyiramo product yawe. Iyi V1 ibika products muri browser yawe (localStorage).</p><button class="primary greenbtn" onclick="showAdmin()">âž• Ongeramo Product</button></div>
 <div class="admin"><h3>ðŸ” Admin</h3><p style="color:var(--muted)">Muri iyi V1 admin ikorera kuri device yawe. Production version ikeneye login + database.</p><button class="primary" onclick="showAdmin()">Fungura Admin</button></div>`);
}
function showAdmin(){closeModal();document.getElementById("adminPanel").style.display="block";document.getElementById("adminPanel").scrollIntoView({behavior:"smooth"})}
function closeAccount(){document.getElementById("adminPanel").style.display="none"}
function addProduct(e){
 e.preventDefault();products.unshift({id:Date.now(),name:pname.value,price:Number(pprice.value),cat:pcat.value,loc:plocation.value||"Rwanda",seller:pseller.value||"OB Seller",emoji:pemoji.value||"ðŸ›ï¸",image:pimage.value,desc:pdesc.value});
 save();e.target.reset();render();toast("âœ… Product yongewemo");closeAccount()
}
function showCategories(){document.getElementById("cats").scrollIntoView({behavior:"smooth"});toast("Hitamo category")}
function home(){window.scrollTo({top:0,behavior:"smooth"})}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("overlay").classList.add("show")}
function closeModal(){document.getElementById("overlay").classList.remove("show")}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2200)}
document.getElementById("lang").addEventListener("change",e=>{
 if(e.target.value==="en"){document.querySelector('[data-t="tag"]').textContent="Everything you need, in one place";document.querySelector('[data-t="hero"]').textContent="Buy, Sell, Connect";document.querySelector('[data-t="heroSub"]').textContent="Many products, good prices.";document.querySelector('[data-t="new"]').textContent="New Products"}
 else{document.querySelector('[data-t="tag"]').textContent="Everything you need, in one place";document.querySelector('[data-t="hero"]').textContent="Gura, Vugure, Ubuhahirane";document.querySelector('[data-t="heroSub"]').textContent="Ibicuruzwa byinshi, ku giciro cyiza.";document.querySelector('[data-t="new"]').textContent="Ibicuruzwa Bishya"}
});
render();updateBadge();
</script>
</body>
</html>
