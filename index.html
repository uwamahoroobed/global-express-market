<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Express Market - Premier African E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-amber-400">Global Express</h1>
                <p class="text-xs text-slate-400">Fast Local & Regional Delivery</p>
            </div>
            <div id="user-section" class="flex items-center gap-3">
                <span id="user-name" class="text-sm font-medium text-slate-200">Uwamahoro Obed</span>
                <button onclick="toggleAdminMode()" id="admin-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs font-bold px-3 py-1.5 rounded transition">Admin Mode 🔑</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Admin Control Panel (Hidden by default) -->
        <section id="admin-panel" class="hidden bg-white p-5 rounded-xl shadow-lg border border-amber-200">
            <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                <span>➕ Add New Product</span>
            </h2>
            <form id="add-product-form" onsubmit="addNewProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" id="p-name" placeholder="Product Name" required class="p-2 border rounded text-sm w-full">
                <input type="number" id="p-price" placeholder="Price (RWF)" required class="p-2 border rounded text-sm w-full">
                <input type="url" id="p-image" placeholder="Image URL (e.g. Unsplash link)" required class="p-2 border rounded text-sm w-full col-span-1 sm:col-span-2">
                <button type="submit" class="bg-emerald-600 text-white font-bold py-2 rounded col-span-1 sm:col-span-2 hover:bg-emerald-700 transition">Save Product</button>
            </form>
        </section>

        <!-- Product Catalog -->
        <section class="bg-white p-5 rounded-xl shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">Available Products</h2>
            </div>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Products will be rendered here dynamically -->
            </div>
        </section>

        <!-- Cart & Checkout -->
        <section class="bg-white p-5 rounded-xl shadow space-y-4">
            <h2 class="text-xl font-bold text-slate-800">Shopping Cart 🛒</h2>
            <div id="cart-items" class="divide-y text-sm text-slate-600">
                <p class="py-2 text-slate-400 italic">Your cart is empty.</p>
            </div>
            <div class="flex justify-between items-center pt-2 font-bold text-lg border-t">
                <span>Total:</span>
                <span id="cart-total" class="text-emerald-600">0 RWF</span>
            </div>

            <!-- GPS Location Integration -->
            <div class="pt-4 border-t space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Delivery Address & GPS Marker</label>
                <div class="flex gap-2">
                    <button type="button" onclick="getLocation()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded flex items-center gap-1 transition">
                        📍 Detect My Location
                    </button>
                    <span id="location-status" class="text-xs text-slate-500 self-center"></span>
                </div>
                <div id="map" class="h-48 w-full rounded border mt-2"></div>
            </div>

            <!-- Send Order Button -->
            <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 shadow-lg text-base transition">
                📲 Send Order via WhatsApp (+250780073151)
            </button>
        </section>

    </main>

    <script>
        // Default product catalog with high quality image URLs
        const defaultProducts = [
            { id: 1, name: "Fresh Fruit Basket", price: 15000, image: "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=500&q=80" },
            { id: 2, name: "Organic Coffee Beans", price: 12000, image: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&q=80" },
            { id: 3, name: "Premium Honey", price: 8000, image: "https://images.unsplash.com/photo-1587049352847-4a222e784d38?w=500&q=80" }
        ];

        let products = JSON.parse(localStorage.getItem('gem_products')) || defaultProducts;
        let cart = [];
        let userLocation = { lat: -1.9441, lng: 30.0619 }; // Default: Kigali, Rwanda
        let isAdmin = false;
        let map, marker;

        // Save products to LocalStorage
        function saveProducts() {
            localStorage.setItem('gem_products', JSON.stringify(products));
            renderProducts();
        }

        // Render products
        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            products.forEach(p => {
                container.innerHTML += `
                    <div class="border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition bg-slate-50 flex flex-col justify-between">
                        <img src="${p.image}" alt="${p.name}" class="h-36 w-full object-cover">
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">${p.name}</h3>
                                <p class="text-emerald-600 font-extrabold text-sm mt-1">${p.price.toLocaleString()} RWF</p>
                            </div>
                            <div class="mt-3 flex gap-1">
                                <button onclick="addToCart(${p.id})" class="flex-1 bg-slate-900 text-white text-xs font-bold py-1.5 rounded hover:bg-slate-800 transition">+ Add to Cart</button>
                                ${isAdmin ? `<button onclick="deleteProduct(${p.id})" class="bg-rose-600 text-white text-xs px-2 rounded hover:bg-rose-700">✕</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Cart Actions
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            renderCart();
        }

        function renderCart() {
            const cartDiv = document.getElementById('cart-items');
            const totalSpan = document.getElementById('cart-total');
            if (cart.length === 0) {
                cartDiv.innerHTML = '<p class="py-2 text-slate-400 italic">Your cart is empty.</p>';
                totalSpan.innerText = '0 RWF';
                return;
            }
            cartDiv.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between py-2 items-center">
                    <span>${item.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-emerald-600">${item.price.toLocaleString()} RWF</span>
                        <button onclick="removeFromCart(${index})" class="text-rose-500 font-bold px-1">✕</button>
                    </div>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalSpan.innerText = `${total.toLocaleString()} RWF`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        // Admin functionality
        function toggleAdminMode() {
            isAdmin = !isAdmin;
            document.getElementById('admin-panel').classList.toggle('hidden', !isAdmin);
            renderProducts();
        }

        function addNewProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const image = document.getElementById('p-image').value;

            products.push({ id: Date.now(), name, price, image });
            saveProducts();
            document.getElementById('add-product-form').reset();
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            saveProducts();
        }

        // Leaflet Map & GPS
        function initMap() {
            map = L.map('map').setView([userLocation.lat, userLocation.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            marker = L.marker([userLocation.lat, userLocation.lng]).addTo(map)
                .bindPopup('Delivery Location').openPopup();
        }

        function getLocation() {
            const status = document.getElementById('location-status');
            if (navigator.geolocation) {
                status.innerText = "Locating...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation.lat = position.coords.latitude;
                        userLocation.lng = position.coords.longitude;
                        map.setView([userLocation.lat, userLocation.lng], 16);
                        marker.setLatLng([userLocation.lat, userLocation.lng])
                            .bindPopup('Your Exact Location').openPopup();
                        status.innerText = "Location updated! ✅";
                    },
                    () => { status.innerText = "Unable to retrieve location."; }
                );
            } else {
                status.innerText = "Geolocation not supported.";
            }
        }

        // WhatsApp Checkout
        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Please add at least one item to your cart!");
                return;
            }
            
            let message = "🛒 *NEW ORDER - GLOBAL EXPRESS*\n\n";
            cart.forEach((item, i) => {
                message += `${i + 1}. ${item.name} - ${item.price.toLocaleString()} RWF\n`;
            });
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `\n💰 *Total:* ${total.toLocaleString()} RWF\n`;
            message += `📍 *Delivery Location (GPS):* https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;

            const phone = "250780073151";
            const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Initialize App
        window.onload = () => {
            renderProducts();
            initMap();
        };
    </script>
</body>
</html>
